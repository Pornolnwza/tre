<style>
/* Layout: bright anatomy studio. Full-screen 3D stage, progress rail on top, explanation card bottom-left (bottom on phones). */
:root{
  --bg-a:#ffffff;
  --bg-b:#d4e8f3;
  --ink:#10303f;
  --muted:#4d6c7b;
  --line:#c3d9e6;
  --accent:#0e86c4;
  --accent-ink:#ffffff;
  --amber:#a15f00;
  --card:rgba(255,255,255,.88);
  --f-display:"Mitr","Noto Sans Thai",system-ui,sans-serif;
  --f-body:"Noto Sans Thai","Segoe UI",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  background-color:#0d0f12;
  background-image:radial-gradient(110% 85% at 58% 30%,#262a30 0%,#181b1f 45%,#0d0f12 100%);
  color:var(--ink);
  font-family:var(--f-body);
  font-size:14px;
  line-height:1.6;
  overflow:hidden;
  padding-block:8px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
#stage{position:fixed;inset:0;z-index:1}
#stage canvas{display:block;width:100%;height:100%}
.app{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;justify-content:space-between;gap:12px;pointer-events:none;min-width:0}
.top{display:flex;flex-direction:column;gap:6px;pointer-events:auto}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;gap:4px 12px;align-items:baseline;flex-wrap:wrap}
.brand b{font-family:var(--f-display);font-weight:500;font-size:18px;letter-spacing:.01em}
.brand span{font-family:var(--f-mono);font-size:11px;color:var(--muted);letter-spacing:.08em}
.top .brand b{color:#e8eef2}
.top .brand span,.top .credit,.top .credit a{color:#9aa7b0}
.rail{display:flex;gap:4px}
.credit{margin:0;font-size:10.5px;line-height:1.4;color:var(--muted)}
.credit a{color:var(--muted);text-decoration:underline}
.credit a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.rail button{flex:1;min-width:0;height:24px;padding:0;border:0;background:transparent;cursor:pointer;position:relative}
.rail button::after{content:"";position:absolute;left:0;right:0;top:10px;height:4px;border-radius:2px;background:var(--line);transition:background .3s}
.rail button.done::after{background:#8cc6e4}
.rail button.on::after{background:var(--accent)}
.rail button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.bottom{display:flex;flex-direction:column;gap:10px;pointer-events:none;min-width:0}
.card{
  pointer-events:auto;
  background:var(--card);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  border:1px solid var(--line);
  border-radius:14px;
  padding:14px 16px 16px;
  box-shadow:0 8px 30px rgba(30,80,110,.12);
  max-height:50vh;overflow-y:auto;
  transition:opacity .45s ease,transform .45s ease;
}
.card.moving{opacity:0;transform:translateY(14px);pointer-events:none}
.kicker{font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.card h2{font-family:var(--f-display);font-weight:500;font-size:22px;line-height:1.3;margin:2px 0 6px;text-wrap:balance}
.card p{margin:0;color:#25485a;max-width:62ch}
.subs{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column;gap:9px}
.subs li{display:grid;grid-template-columns:24px minmax(0,1fr);gap:10px;align-items:start}
.subs .n{width:24px;height:24px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font:600 12px var(--f-mono);display:grid;place-items:center}
.subs li{transition:opacity .3s}
.subs.has-on li:not(.on){opacity:.45}
.subs strong{display:block;font-weight:600;line-height:1.4}
.subs em{font:400 11px var(--f-mono);font-style:normal;color:var(--muted);margin-left:6px}
.subs span{display:block;color:#25485a;font-size:13px;line-height:1.55}
.fact{margin-top:12px;padding-top:10px;border-top:1px dashed var(--line);font-family:var(--f-mono);font-size:12px;line-height:1.6;color:var(--amber)}
.controls{pointer-events:auto;display:flex;gap:8px}
.btn{
  font:500 14px var(--f-body);
  min-height:44px;padding:8px 16px;
  border-radius:10px;border:1px solid var(--line);
  background:#fff;color:var(--ink);cursor:pointer;
  transition:border-color .2s,background .2s;
}
.btn:hover:not(:disabled){border-color:var(--accent)}
.btn.primary{flex:1;background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.primary:hover:not(:disabled){background:#0b74aa}
.btn:disabled{opacity:.4;cursor:default}
.btn.small{min-height:36px;padding:4px 12px;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.rec-exit{display:none;position:fixed;top:max(8px,env(safe-area-inset-top,0px));right:max(8px,env(safe-area-inset-right,0px));z-index:6;opacity:0;cursor:pointer;font:500 12px var(--f-body);padding:6px 12px;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--ink)}
.rec-exit:hover,.rec-exit:focus-visible{opacity:1}
body.rec .rec-exit{display:block}
.rec-next{display:none;position:fixed;right:max(14px,env(safe-area-inset-right,0px));top:50%;transform:translateY(-50%);z-index:6;width:56px;height:56px;padding:0;border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,.6);color:var(--ink);opacity:.6;align-items:center;justify-content:center;cursor:pointer;-webkit-tap-highlight-color:transparent}
.rec-next:active{opacity:1}
@media (hover:none) and (pointer:coarse){
  body.rec .rec-next{display:flex}
  body.rec .rec-exit{opacity:.55}
}
body.rec .top,body.rec .controls{display:none}
body.rec{cursor:none}
body.rec .rec-exit{cursor:pointer}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tag{position:fixed;left:0;top:0;z-index:3;pointer-events:none;display:flex;align-items:center;opacity:0;transition:opacity .35s;will-change:transform}
.tag.show{opacity:1}
.tag i{display:block;width:12px;height:12px;margin:0 -6px;border-radius:50%;background:var(--accent);border:2px solid #fff;box-shadow:0 0 0 4px rgba(14,134,196,.28)}
.tag u{display:block;width:40px;height:2px;background:var(--accent)}
.tag span{display:block;background:#fff;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:3px 11px;font:600 13px var(--f-body);white-space:nowrap;box-shadow:0 3px 10px rgba(30,80,110,.16)}
.tag small{font:400 11px var(--f-mono);color:var(--muted);margin-left:6px}
.tag.flip{flex-direction:row-reverse}
.fail{position:fixed;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;background:var(--bg-a);color:var(--ink)}
@media (min-width:860px){
  body{padding-block:16px}
  .bottom{width:min(440px,100%)}
  .card{padding:18px 20px 20px;max-height:min(66vh,600px)}
  .card h2{font-size:26px}
  .card p{font-size:15px}
}
@media (prefers-reduced-motion:reduce){
  .card,.tag{transition:none}
  .rail button::after{transition:none}
}
</style>

/* ---------- geometry helpers ---------- */
function V3(a){return new T.Vector3(a[0],a[1],a[2]);}
function curveOf(p){return new T.CatmullRomCurve3(p.map(function(a){return V3(W(a));}),false,'centripetal');}

/* tube whose radius changes along its length; rf(t) with t in 0..1 */
function tubeCore(c,rf,segs,rad){
  segs=segs||120;rad=rad||14;
  var fr=c.computeFrenetFrames(segs,false),pos=[],idx=[],i,j,w=rad+1;
  for(i=0;i<=segs;i++){
    var t=i/segs,p=c.getPointAt(t),r=rf(t),N=fr.normals[i],B=fr.binormals[i];
    for(j=0;j<=rad;j++){
      var a=j/rad*Math.PI*2,co=Math.cos(a)*r,si=Math.sin(a)*r;
      pos.push(p.x+N.x*co+B.x*si,p.y+N.y*co+B.y*si,p.z+N.z*co+B.z*si);
    }
  }
  for(i=0;i<segs;i++)for(j=0;j<rad;j++){var a0=i*w+j,b0=a0+w;idx.push(a0,b0,a0+1,b0,b0+1,a0+1);}
  var g=new T.BufferGeometry();
  g.setAttribute('position',new T.Float32BufferAttribute(pos,3));
  g.setIndex(idx);g.computeVertexNormals();
  var n=g.attributes.normal;
  for(i=0;i<=segs;i++){
    var s0=i*w,s1=i*w+rad;
    var nx=(n.getX(s0)+n.getX(s1))/2,ny=(n.getY(s0)+n.getY(s1))/2,nz=(n.getZ(s0)+n.getZ(s1))/2;
    n.setXYZ(s0,nx,ny,nz);n.setXYZ(s1,nx,ny,nz);
  }
  return g;
}
/* anatomy tube: points go through the body fit, radius scales with it */
function tubeGeo(pts,rf,segs,rad){return tubeCore(curveOf(pts),function(t){return rf(t)*S;},segs,rad);}
/* tube in plain world or group coordinates, used by the nephron zoom */
function tubeRaw(pts,rf,segs,rad){return tubeCore(new T.CatmullRomCurve3(pts.map(V3),false,'centripetal'),rf,segs,rad);}
/* unit sphere pushed around by fn(x,y,z) -> [x,y,z] */
function blobGeo(fn){
  var g=new T.SphereGeometry(1,56,40),p=g.attributes.position,o;
  for(var i=0;i<p.count;i++){o=fn(p.getX(i),p.getY(i),p.getZ(i));p.setXYZ(i,o[0]*S,o[1]*S,o[2]*S);}
  g.computeVertexNormals();
  return g;
}
function pm(color,o){

  if(from===5){st.sub=-1;markSub(-1);setParticles(-1);}
  if(n===5){var zf=zFrame(-1);cur5.pos.copy(zf.pos);cur5.look.copy(zf.look);}
  if(from===-1){dropPos.copy(SEG[0].getPoint(0));hist.length=0;drop.visible=true;trail.visible=true;if(m.p0)m.p0.copy(dropPos);}
  if(!m.seg)hist.length=0;
  st.mv=m;st.rip=0;
  card.classList.add('moving');
  tag.classList.remove('show');
  syncUI();
}
function arrive(n){
  st.cur=n;st.mv=null;
  if(n<0){drop.visible=false;trail.visible=false;hist.length=0;}
  setCard(n);
  card.classList.remove('moving');
  if(n===N-1)st.rip=performance.now()/1000;
  if(n===5){st.sub=-1;st.subT0=performance.now()/1000;setParticles(-1);markSub(-1);}
  syncUI();
  schedule(n===5?SUBDWELL[0]:dwellOf(Math.max(n,0)));
}

btnNext.addEventListener('click',function(){advance();});
btnPrev.addEventListener('click',function(){
  if(!st.mv&&st.cur===5&&st.sub>=0){enterSub(st.sub-1);return;}
  go(st.cur-1);
});
btnAuto.addEventListener('click',function(){
  st.auto=!st.auto;syncUI();
  if(st.auto)schedule(1500);else clearTimeout(st.timer);
});
window.addEventListener('keydown',function(e){
  if(e.key==='ArrowRight'){btnNext.click();}
  else if(e.key==='ArrowLeft'&&!btnPrev.disabled){btnPrev.click();}
  else if(e.key==='Escape'&&recFlag){recOff();}
  else if((e.key===' '||e.key==='Enter')&&recFlag){e.preventDefault();advance();}
});
var px=0,py=0,tx=0,ty=0;

/* recording mode: only the body and the card stay on screen, and the tour plays from the start */
var btnRec=$('rec'),btnRecExit=$('recExit'),btnRecNext=$('recNext'),recFlag=false,recT=0;
function fsEnter(){
  try{var el=document.documentElement;if(el&&el.requestFullscreen){var p=el.requestFullscreen();if(p&&p.catch)p.catch(function(){});}}catch(e){}
}
function fsLeave(){
  try{if(document.fullscreenElement&&document.exitFullscreen){var p=document.exitFullscreen();if(p&&p.catch)p.catch(function(){});}}catch(e){}
}
function recStart(){
  clearTimeout(recT);
  if(!recFlag)return;
  if(st.mv){recT=setTimeout(recStart,400);return;}
  if(st.cur!==-1){go(-1);recT=setTimeout(recStart,400);return;}
  recT=setTimeout(function(){
    if(recFlag&&st.cur===-1&&!st.mv){st.auto=true;syncUI();advance();}
  },2500);
}
function recOn(){
  if(recFlag)return;
  recFlag=true;document.body.classList.add('rec');
  tx=0;ty=0;st.auto=true;syncUI();
  fsEnter();
  recT=setTimeout(recStart,600);
}
function recOff(){
  if(!recFlag)return;
  recFlag=false;clearTimeout(recT);
  document.body.classList.remove('rec');
  fsLeave();
}
btnRec.addEventListener('click',recOn);
btnRecExit.addEventListener('click',recOff);
btnRecNext.addEventListener('click',function(){advance();});
if(document.addEventListener)document.addEventListener('fullscreenchange',function(){
  if(recFlag&&!document.fullscreenElement)recOff();
});
window.addEventListener('pointermove',function(e){
  if(recFlag)return;
  tx=(e.clientX/window.innerWidth-0.5)*2;ty=(e.clientY/window.innerHeight-0.5)*2;
});

/* ---------- resize ---------- */
function resize(){
  var w=stageEl.clientWidth||window.innerWidth,h=stageEl.clientHeight||window.innerHeight;
  renderer.setSize(w,h,false);
  var asp=w/h;
  camera.aspect=asp;
  kScale=asp<1?Math.min(2,0.95/asp):1;
  kOv=asp<1?Math.min(1.5,Math.max(1,9.6/(asp*15.5))):1;
  if(asp<0.9){camera.setViewOffset(w,h,0,h*0.2,w,h);}
  else if(w>=860){camera.setViewOffset(w,h,-w*0.14,0,w,h);}
  else{camera.clearViewOffset();}
  camera.updateProjectionMatrix();
  trailMat.uniforms.uS.value=h*1.45*0.14*renderer.getPixelRatio();
  trailMat.uniforms.uM.value=26*renderer.getPixelRatio();
  pmat.uniforms.uS.value=h*1.45*renderer.getPixelRatio();
}
window.addEventListener('resize',resize);

/* ---------- label that follows the organ ---------- */
var tv=new T.Vector3();
function updateTag(focus){
  var s=(!st.mv&&focus>=0&&focus<N-1)?STOPS[focus]:null;
  var w=stageEl.clientWidth||window.innerWidth,h=stageEl.clientHeight||window.innerHeight;
  updateLabels(focus,w,h);
  if(!s||!s.tag||(focus===5&&st.sub>=0)){tag.classList.remove('show');return;}
  tv.set(s.tag[0],s.tag[1],s.tag[2]);
  /* the dot sits on the organ: left edge when the label points right, right edge when it points left */
  var p=tv.clone().project(camera);
  placeTag(tag,tv,(p.x*0.5+0.5)*w>w*0.58,w,h);
  tag.classList.add('show');
}

/* ---------- frame loop ---------- */
var camPos=new T.Vector3(),camLook=new T.Vector3(),last=performance.now()/1000;
function frame(){
  requestAnimationFrame(frame);
  var now=performance.now()/1000,dt=Math.min(0.1,now-last);last=now;
  var m=st.mv,a,b,e=0;
  if(m){
    var u=Math.min(1,(now-m.t0)/m.dur);e=ease(u);
    if(m.seg)dropPos.copy(m.seg.getPointAt(m.rev?1-e:e));else dropPos.lerpVectors(m.p0,m.p1,e);
    a=m.from;b=m.to;
    if(u>=1){arrive(m.to);}
  }else{
    a=b=st.cur;
    if(st.cur>=0)dropPos.copy(SEG[st.cur].getPoint(1));
  }
  if(!st.mv&&st.cur===5){
    var tf=zFrame(st.sub),kk=1-Math.exp(-dt*2.6);
    cur5.pos.lerp(tf.pos,kk);cur5.look.lerp(tf.look,kk);
  }
  var cA=frameOf(a),cB=frameOf(b);
  camPos.lerpVectors(cA.pos,cB.pos,e);camLook.lerpVectors(cA.look,cB.look,e);
  px+=(tx-px)*Math.min(1,dt*2);py+=(ty-py)*Math.min(1,dt*2);
  var sway=RM?0:1;
  camPos.x+=Math.sin(now*0.35)*0.12*sway+px*0.35*sway;
  camPos.y+=Math.sin(now*0.27)*0.05*sway-py*0.15*sway;
  camera.position.copy(camPos);camera.lookAt(camLook);

  dropColor.copy(colOf(a)).lerp(colOf(b),e);
  dropCore.material.color.copy(dropColor);
  drop.position.copy(dropPos);
  /* keep the drop a sensible size on screen when the camera is close */
  drop.scale.setScalar((1+Math.sin(now*5)*0.1)*Math.max(0.3,Math.min(1,camPos.distanceTo(dropPos)/7)));
  if(drop.visible){
    /* add points at a fixed spacing along the path, so a slow frame rate (iPad) leaves no gaps in the stream */
    if(!hist.length)hist.unshift(dropPos.clone());
    else{
      var from=hist[0].clone(),gap=from.distanceTo(dropPos);
      if(gap>0.02){
        var cnt=Math.min(60,Math.floor(gap/0.02));
        for(var qi=1;qi<=cnt;qi++)hist.unshift(from.clone().lerp(dropPos,qi/cnt));
        while(hist.length>TN)hist.pop();
      }
    }
    for(var i=0;i<TN;i++){
      var p=i<hist.length?hist[i]:dropPos;
      tpos[i*3]=p.x;tpos[i*3+1]=p.y;tpos[i*3+2]=p.z;
      talpha[i]=i<hist.length?Math.pow(1-i/TN,1.6):0;
    }
    tg.attributes.position.needsUpdate=true;tg.attributes.aA.needsUpdate=true;
  }

  /* organs: the one being explained is solid, the rest fade back */
  var focus=st.mv?st.mv.to:st.cur,k=1-Math.exp(-dt*6);
  var showAll=(focus<0||focus===N-1);
  organs.forEach(function(o){
    var tgt;
    if(o.fixed!=null)tgt=o.fixed;
    else if(showAll)tgt=0.95;
    else tgt=o.stops.indexOf(focus)>=0?o.foc:0.14;
    o.mat.opacity+=(tgt-o.mat.opacity)*k;
    o.mat.depthWrite=o.mat.opacity>0.92;
  });
  updateZoom(dt,now,focus);
  skin.uniforms.uFade.value+=((showAll?1:0.3)-skin.uniforms.uFade.value)*k;
  heart.scale.setScalar(1+Math.max(0,Math.sin(now*6))*0.06*sway);

  var lvl=focus===7?0.95:(focus>=8?0.3:0.1),s=0.35+0.65*lvl;
  fill.scale.x+=(0.36*S*s-fill.scale.x)*k*0.5;
  fill.scale.y+=(0.3*S*s-fill.scale.y)*k*0.5;
  fill.scale.z+=(0.32*S*s-fill.scale.z)*k*0.5;

  if(st.rip&&focus===N-1){
    var r=((now-st.rip)%2.4)/2.4;
    ripple.scale.setScalar(0.3+r*1.8);ripple.material.opacity=0.7*(1-r);
  }else ripple.material.opacity=0;

  renderer.render(scene,camera);
  updateTag(focus);
}

/* ---------- start ---------- */
resize();
(function(){var z=zFrame(-1);cur5.pos.copy(z.pos);cur5.look.copy(z.look);})();
var f0=frameOf(-1);camera.position.copy(f0.pos);camera.lookAt(f0.look);
setCard(-1);syncUI();
frame();
})();
</script>

</body></html>
